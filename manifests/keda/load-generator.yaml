# Генератор нагрузки: плавно наращивает RPS на business-app по S-образной кривой —
# обратной функции распределения закона Симпсона (треугольное распределение, мода 600).
#
# За CYCLE (по умолчанию 20м) RPS растёт с 0 до 1000: медленно в начале, быстрее
# в середине, снова медленно к концу. После CYCLE удерживается максимум 1000 RPS.
#
# Рост RPS → KEDA поднимает реплики business-app → новые поды вытесняют
# capacity-overprovisioning поды (приоритет -10) → Cluster Autoscaler добавляет ноды.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  labels:
    app: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
      - name: load-generator
        image: ghcr.io/patsevanton/k8s-priority-eviction-autoscaling/load-generator:1.2.0
        env:
        - name: TARGET_URL
          value: "http://business-app:8080/"
        - name: CYCLE
          value: "20m" # длительность нарастания RPS 0→1000, затем удержание максимума
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

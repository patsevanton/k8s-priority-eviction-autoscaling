# Генератор нагрузки: гоняет на business-app лестницу RPS «день/ночь».
#
# Профиль по умолчанию (LOAD_PROFILE):
#   ночь 0 RPS (2м) → 5 RPS (3м) → 20 RPS (3м) → 60 RPS (3м) → пик 100 RPS (5м)
#   → спад 20 RPS (3м) → ночь 0 RPS (2м), затем повтор.
#
# Рост RPS → KEDA поднимает реплики business-app → новые поды вытесняют
# placeholder'ы (приоритет -1000) → CA добавляет ноды под буфер.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  labels:
    app: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
      - name: load-generator
        image: ghcr.io/patsevanton/k8s-priority-eviction-autoscaling/load-generator:latest
        env:
        - name: TARGET_URL
          value: "http://business-app:8080/"
        - name: LOAD_PROFILE
          value: "0/2m;5/3m;20/3m;60/3m;100/5m;20/3m;0/2m"
        - name: REPEAT
          value: "0" # 0 — повторять профиль бесконечно
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

# Генератор нагрузки: плавно наращивает RPS на business-app по гладкой S-образной
# кривой smoothstep — без излома в точке перегиба: медленно в начале, быстрее
# в середине, снова медленно к концу.
#
# За CYCLE (по умолчанию 30м) RPS растёт с MIN_RPS до MAX_RPS. MIDPOINT задаёт
# точку перегиба в долях от CYCLE (0.5 — симметричный подъём: 50% роста ровно
# в середине). После CYCLE удерживается максимум MAX_RPS.
#
# Пик 600 RPS → ceil(600/25) = 24 реплики × 250m CPU = 6000m — помещается
# в 5 нод по 2 vCPU с запасом под системные поды.
#
# Рост RPS → KEDA поднимает реплики business-app → новые поды вытесняют
# capacity-overprovisioning поды (приоритет -10) → Cluster Autoscaler добавляет ноды.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  labels:
    app: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
      - name: load-generator
        image: ghcr.io/patsevanton/k8s-priority-eviction-autoscaling/load-generator:1.3.0
        env:
        - name: TARGET_URL
          value: "http://business-app:8080/"
        - name: CYCLE
          value: "30m" # длительность нарастания RPS MIN_RPS→MAX_RPS, затем удержание максимума
        - name: MIN_RPS
          value: "0"
        - name: MAX_RPS
          value: "600" # пик нагрузки: ceil(600/25) = 24 реплики, помещается в 5 нод
        - name: MIDPOINT
          value: "0.5" # точка перегиба S-кривой в долях CYCLE: 50% роста ровно в середине
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

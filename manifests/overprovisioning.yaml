# Capacity-overprovisioning поды для предварительного резервирования мощностей (overprovisioning).
# Pause-контейнер не делает ничего — его единственная задача через resources.requests
# «занимать место» на нодах, которое мгновенно освободится при вытеснении.
#
# Математика резерва для демо-стенда (нода 2 vCPU / 4 ГБ, системные резервы ~600m CPU):
#   replicas 2 × (250m CPU / 250Mi) ≈ резерв под будущий пик.
# Измените replicas и requests под размер вашего типичного всплеска нагрузки.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overprovisioning
  labels:
    app: overprovisioning
spec:
  replicas: 2
  selector:
    matchLabels:
      app: overprovisioning
  template:
    metadata:
      labels:
        app: overprovisioning
    spec:
      # Отрицательный приоритет: любой под без priorityClassName (приоритет 0)
      # вытеснит capacity-overprovisioning под мгновенно.
      priorityClassName: capacity-overprovisioning
      # Не ждём 30 секунд graceful shutdown — место должно освобождаться сразу
      terminationGracePeriodSeconds: 0
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10
        resources:
          requests:
            cpu: 250m
            memory: 250Mi
          limits:
            cpu: 250m
            memory: 250Mi

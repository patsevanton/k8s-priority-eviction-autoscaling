# Критически важное приложение.
# priorityClassName не указан — под получает приоритет 0 (выше -1000 у placeholder'ов).
# При нехватке ресурсов вытесняет placeholder-поды.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: critical-app
  labels:
    app: critical-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: critical-app
  template:
    metadata:
      labels:
        app: critical-app
    spec:
      containers:
      - name: app
        image: nginx:1.27
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 900m # Не помещается на ноду вместе с placeholder-подом: будет вытеснение
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi

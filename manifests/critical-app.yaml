# Критически важное приложение (высокий приоритет).
# priorityClassName не указан — под получает high-priority-default (1000000)
# через globalDefault. При нехватке ресурсов вытесняет placeholder-поды.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: critical-app
  labels:
    app: critical-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: critical-app
  template:
    metadata:
      labels:
        app: critical-app
    spec:
      # priorityClassName: high-priority-default # можно указать явно; globalDefault применит его сам
      containers:
      - name: app
        image: nginx:1.27
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 900m # Не помещается на ноду вместе с placeholder-подом: будет вытеснение
            memory: 1.5Gi
          limits:
            cpu: "1"
            memory: 2Gi

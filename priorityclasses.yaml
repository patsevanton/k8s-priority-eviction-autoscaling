# PriorityClass для capacity-overprovisioning подов (overprovisioning): отрицательное значение
# делает их первыми кандидатами на вытеснение — ниже только системные классы.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: capacity-overprovisioning
value: -10 # Отрицательный приоритет: вытесняются раньше обычных подов, но не ниже cutoff Cluster Autoscaler
description: "Отрицательный приоритет для capacity-overprovisioning подов предварительного резервирования мощностей"
